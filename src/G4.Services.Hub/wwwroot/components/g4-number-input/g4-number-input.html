<!--
    G4 number input: the owner's number box (it replaces the slot) with themed up/down steppers
    inside its right edge. See g4-number-input.js.
-->
<template id="g4-number-input-template">
    <div class="g4-number-input__wrap" data-test-id="box">
        <span data-part="input-slot"></span>
        <div class="g4-number-input__steppers" data-test-id="steppers">
            <button type="button"
                    class="g4-number-input__step"
                    title="Increase"
                    data-part="increase"
                    data-test-id="increase-button"
                    aria-label="Increase"
                    tabindex="-1">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true"><path fill="currentColor" d="M300.3 199.2C312.9 188.9 331.4 189.7 343.1 201.4L471.1 329.4C480.3 338.6 483 352.3 478 364.3C473 376.3 461.4 384 448.5 384L192.5 384C179.6 384 167.9 376.2 162.9 364.2C157.9 352.2 160.7 338.5 169.9 329.4L297.9 201.4L300.3 199.2z"/></svg>
            </button>
            <button type="button"
                    class="g4-number-input__step"
                    title="Decrease"
                    data-part="decrease"
                    data-test-id="decrease-button"
                    aria-label="Decrease"
                    tabindex="-1">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true"><path fill="currentColor" d="M300.3 440.8C312.9 451 331.4 450.3 343.1 438.6L471.1 310.6C480.3 301.4 483 287.7 478 275.7C473 263.7 461.4 256 448.5 256L192.5 256C179.6 256 167.9 263.8 162.9 275.8C157.9 287.8 160.7 301.5 169.9 310.6L297.9 438.6L300.3 440.8z"/></svg>
            </button>
        </div>
    </div>
</template>
